paths:
  input_dir: ./outputs
  chunks_dir: ./chunks
  chroma_dir: ./chroma_db
  bm25_index_path: ./bm25_index.pkl
  collection_name: rag_docs
  chat_history_file: ./chat_history.json
ollama:
  host: http://localhost:11434
  num_ctx: 65536
runtime:
  sequential_model_loading: true
  unload_after_step: true
  verify_unload: true
  unload_timeout_seconds: 30
  unload_poll_interval_seconds: 0.5
models:
  embedding: qwen3-embedding:8b
  embedding_tokenizer_hf_id: Qwen/Qwen3-Embedding-8B
  generation: qwen2.5:14b
  chunk_refiner: qwen2.5:14b
  contextual_enricher: qwen2.5:14b
  reranker: Qwen/Qwen3-Reranker-0.6B
  reranker_ollama: B-A-M-N/qwen3-reranker-0.6b-fp16:latest
  ragas_judge: qwen2.5:14b
chunking:
  md_glob: '**/*.md'
  verbose: true
  preprocessor:
    image_alt_strategy: separate
    drop_toc_tables: true
    strip_superscripts: true
    fix_adjacent_tables: true
    strip_decorative_lines: true
  structure_splitter:
    header_levels:
    - 1
    - 2
    - 3
    tables_atomic: true
    min_section_chars: 20
  semantic_chunker:
    breakpoint_threshold_type: percentile
    breakpoint_threshold_amount: 85.0
    min_chunk_chars: 80
    max_chunk_chars: 2000
    use_token_based_sizing: true
    min_chunk_tokens: 15
    max_chunk_tokens: 1024
    attempt_real_tokenizer: true
    skip_semantic_if_small: true
    num_ctx: null
  llm_chunk_refiner:
    enabled: false
    timeout_seconds: 30
    min_chunks_to_consider: 2
    max_chunks_per_call: 12
    fallback_on_error: true
    warn_on_fallback: true
    num_ctx: null
  table_normalizer:
    enabled: true
    fallback_to_raw_on_error: true
    warn_on_fallback: true
  contextual_enricher:
    mode: deterministic
    llm_timeout_seconds: 30
    max_document_chars_for_llm: 3000
    fallback_to_deterministic_on_error: true
    warn_on_fallback: true
    include_breadcrumb: true
    include_source_filename: true
    num_ctx: null
  embed_text:
    enabled: true
    passage_prefix: ''
    query_prefix: 'Instruct: Given a search query, retrieve relevant passages that
      answer the query Query:'
  metadata:
    include_source_file: true
    include_breadcrumb: true
    include_chunk_type: true
    include_page_metadata: true
    include_language: true
    include_chunk_index: true
embedding:
  batch_size: 16
  num_ctx: null
storage:
  chroma:
    batch_size: 200
  bm25:
    k1: 1.5
    b: 0.75
retrieval:
  hybrid:
    dense_n_results: 30
    sparse_n_results: 30
    final_n_results: 10
    rrf_k: 60
    language_filter: true
  reranker:
    enabled: false
    backend: ollama
    max_length: 4096
    final_n_results: 8
    candidate_pool: 20
    device: null
    model_kwargs:
      torch_dtype: float16
    task_instruction: Given a search query, determine whether this document contains
      information that answers the query.
    ollama_top_logprobs: 20
    ollama_num_ctx: 4096
    huggingface_unload_after_use: true
generation:
  temperature: 0.2
  timeout_seconds: 60
  num_ctx: 129024
  context_builder:
    include_type_label: true
    include_source: true
    include_breadcrumb: true
    label_heading_levels: true
    cite_document_location: true
    max_chunks_per_section: 2
    document_map: auto
    document_map_max_chapters: 3
    document_map_max_sections: 12
    max_chunks: 5
    max_chars_per_chunk: 1500
  n_results: 15
evaluation:
  metrics:
  - context_precision
  - context_recall
  - faithfulness
  - answer_relevancy
  context_recall_warning_threshold: 0.8
  faithfulness_warning_threshold: 0.85
  judge_max_workers: 2
  judge_timeout_seconds: 300
  questions_path: ./rag_pipeline/evaluation/sample_eval_questions.json
  save_results_path: null
  judge_num_ctx: null
  embedding_num_ctx: null
webapp:
  host: 127.0.0.1
  port: 5000
  debug: false
