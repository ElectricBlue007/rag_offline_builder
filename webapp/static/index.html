<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RAG Console</title>
<style>
  :root{
    --bg:            #0c0e14;
    --panel:         #12151d;
    --panel-alt:     #171b26;
    --border:        #232838;
    --text:          #e7e9f0;
    --muted:         #8a90a8;
    --accent:        #6ee7ff;
    --accent-dim:    #2a5a66;
    --user-bubble:   #17232b;
    --user-border:   #2b4a55;
    --assist-bubble: #171a23;
    --danger:        #ff7a7a;
    --radius:        10px;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
    font-size:15px;
    display:flex;
    height:100vh;
    overflow:hidden;
  }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:#2a2f3d; border-radius:8px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  /* ── Sidebar ─────────────────────────────────────────── */
  #sidebar{
    width:260px;
    min-width:260px;
    background:var(--panel);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    padding:14px;
  }
  #brand{
    display:flex;
    align-items:center;
    gap:8px;
    padding:4px 6px 16px;
    font-weight:600;
    letter-spacing:.2px;
  }
  #brand .dot{
    width:9px; height:9px; border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 8px var(--accent);
  }
  #new-chat-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:10px 12px;
    border-radius:var(--radius);
    border:1px solid var(--border);
    background:var(--panel-alt);
    color:var(--text);
    cursor:pointer;
    font-size:14px;
    font-weight:500;
    transition:border-color .15s, background .15s;
  }
  #new-chat-btn:hover{ border-color:var(--accent-dim); background:#1b2130; }

  #chat-list{
    flex:1;
    overflow-y:auto;
    margin-top:14px;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .chat-item{
    display:flex;
    align-items:center;
    gap:8px;
    padding:9px 10px;
    border-radius:8px;
    cursor:pointer;
    color:var(--muted);
    font-size:13.5px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .chat-item:hover{ background:var(--panel-alt); color:var(--text); }
  .chat-item.active{ background:var(--panel-alt); color:var(--text); box-shadow:inset 2px 0 0 var(--accent); }
  .chat-item .title{ flex:1; overflow:hidden; text-overflow:ellipsis; }
  .chat-item .del{
    opacity:0; color:var(--muted); font-size:15px; line-height:1;
    padding:2px 5px; border-radius:5px;
  }
  .chat-item:hover .del{ opacity:1; }
  .chat-item .del:hover{ color:var(--danger); background:#2a1518; }

  #sidebar-footer{
    padding-top:10px;
    border-top:1px solid var(--border);
    font-size:11.5px;
    color:var(--muted);
  }

  /* ── Main ────────────────────────────────────────────── */
  #main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  #header{
    padding:16px 24px;
    border-bottom:1px solid var(--border);
    font-size:13.5px;
    color:var(--muted);
    display:flex;
    justify-content:space-between;
  }
  #messages{
    flex:1;
    overflow-y:auto;
    padding:24px;
    display:flex;
    flex-direction:column;
    gap:20px;
  }
  #empty-state{
    margin:auto;
    text-align:center;
    color:var(--muted);
    max-width:420px;
  }
  #empty-state h1{
    font-size:20px;
    color:var(--text);
    margin-bottom:8px;
    font-weight:600;
  }
  #empty-state p{ font-size:13.5px; line-height:1.5; }

  .msg-row{ display:flex; }
  .msg-row.user{ justify-content:flex-end; }
  .msg-row.assistant{ justify-content:flex-start; }

  .bubble{
    max-width:72%;
    padding:12px 15px;
    border-radius:var(--radius);
    line-height:1.55;
    white-space:pre-wrap;
    word-wrap:break-word;
  }
  .msg-row.user .bubble{
    background:var(--user-bubble);
    border:1px solid var(--user-border);
    border-bottom-right-radius:3px;
  }
  .msg-row.assistant .bubble{
    background:var(--assist-bubble);
    border:1px solid var(--border);
    border-bottom-left-radius:3px;
  }
  .msg-row.assistant .bubble.error{
    border-color:#4a2a2a;
    color:var(--danger);
  }

  .sources{
    margin-top:10px;
    padding-top:10px;
    border-top:1px dashed var(--border);
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .source-chip{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:11.5px;
    color:var(--muted);
  }
  .source-chip b{ color:var(--accent); font-weight:600; }

  .thinking{ display:flex; gap:4px; padding:4px 0; }
  .thinking span{
    width:6px; height:6px; border-radius:50%;
    background:var(--muted);
    animation:blink 1.2s infinite ease-in-out;
  }
  .thinking span:nth-child(2){ animation-delay:.2s; }
  .thinking span:nth-child(3){ animation-delay:.4s; }
  @keyframes blink{ 0%,80%,100%{ opacity:.25; } 40%{ opacity:1; } }

  /* ── Composer ────────────────────────────────────────── */
  #composer{
    border-top:1px solid var(--border);
    padding:16px 24px 20px;
  }
  #composer-inner{
    display:flex;
    align-items:flex-end;
    gap:10px;
    background:var(--panel-alt);
    border:1px solid var(--border);
    border-radius:14px;
    padding:8px 8px 8px 16px;
    transition:border-color .15s;
  }
  #composer-inner:focus-within{ border-color:var(--accent-dim); }
  #input{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    resize:none;
    color:var(--text);
    font-size:15px;
    font-family:inherit;
    max-height:160px;
    line-height:1.5;
    padding:8px 0;
  }
  #input::placeholder{ color:var(--muted); }
  #send-btn{
    width:36px; height:36px;
    border-radius:10px;
    border:none;
    background:var(--accent);
    color:#08151a;
    font-weight:700;
    cursor:pointer;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    transition:opacity .15s, transform .1s;
  }
  #send-btn:disabled{ opacity:.35; cursor:default; }
  #send-btn:not(:disabled):active{ transform:scale(.94); }
  #hint{
    margin-top:8px;
    font-size:11.5px;
    color:var(--muted);
    text-align:center;
  }
</style>
</head>
<body>

<div id="sidebar">
  <div id="brand"><span class="dot"></span> RAG Console</div>
  <button id="new-chat-btn">+ New chat</button>
  <div id="chat-list"></div>
  <div id="sidebar-footer">Chats are saved to <code>chat_history.json</code> on disk.</div>
</div>

<div id="main">
  <div id="header">
    <span id="header-title">No chat selected</span>
    <span id="header-status"></span>
  </div>
  <div id="messages">
    <div id="empty-state">
      <h1>Ask your documents anything</h1>
      <p>Questions go through hybrid retrieval and a local LLM. Answers cite the exact source chunks they're grounded in — in whatever language you ask in.</p>
    </div>
  </div>
  <div id="composer">
    <div id="composer-inner">
      <textarea id="input" rows="1" placeholder="Ask a question…"></textarea>
      <button id="send-btn" title="Send">↑</button>
    </div>
    <div id="hint">Enter to send · Shift+Enter for a new line</div>
  </div>
</div>

<script>
const chatListEl   = document.getElementById('chat-list');
const messagesEl   = document.getElementById('messages');
const emptyStateEl = document.getElementById('empty-state');
const inputEl      = document.getElementById('input');
const sendBtn      = document.getElementById('send-btn');
const headerTitle  = document.getElementById('header-title');
const headerStatus = document.getElementById('header-status');

let currentChatId = null;
let chats = [];
let sending = false;

async function api(path, opts) {
  const res = await fetch(path, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
  });
  if (!res.ok && res.status !== 502 && res.status !== 500) {
    throw new Error(`Request failed: ${res.status}`);
  }
  return res.json();
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[c]));
}

function renderChatList() {
  chatListEl.innerHTML = '';
  for (const chat of chats) {
    const item = document.createElement('div');
    item.className = 'chat-item' + (chat.id === currentChatId ? ' active' : '');
    item.innerHTML = `<span class="title">${escapeHtml(chat.title || 'New chat')}</span><span class="del">×</span>`;
    item.querySelector('.title').addEventListener('click', () => openChat(chat.id));
    item.querySelector('.del').addEventListener('click', (e) => {
      e.stopPropagation();
      deleteChat(chat.id);
    });
    chatListEl.appendChild(item);
  }
}

async function refreshChatList() {
  chats = await api('/api/chats');
  renderChatList();
}

function addMessageBubble(role, content, sources, isError) {
  emptyStateEl.style.display = 'none';
  const row = document.createElement('div');
  row.className = `msg-row ${role}`;
  const bubble = document.createElement('div');
  bubble.className = 'bubble' + (isError ? ' error' : '');
  bubble.textContent = content;
  row.appendChild(bubble);

  if (sources && sources.length) {
    const box = document.createElement('div');
    box.className = 'sources';
    sources.forEach((s, i) => {
      const chip = document.createElement('div');
      chip.className = 'source-chip';
      const pages = (s.page_numbers && s.page_numbers.length) ? `, p.${s.page_numbers}` : '';
      chip.innerHTML = `<b>[${i + 1}]</b> ${escapeHtml(s.source_file || '?')}${pages}${s.breadcrumb ? ' — ' + escapeHtml(s.breadcrumb) : ''}`;
      box.appendChild(chip);
    });
    bubble.appendChild(box);
  }
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return row;
}

function addThinkingBubble() {
  emptyStateEl.style.display = 'none';
  const row = document.createElement('div');
  row.className = 'msg-row assistant';
  row.id = 'thinking-row';
  row.innerHTML = `<div class="bubble"><div class="thinking"><span></span><span></span><span></span></div></div>`;
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function removeThinkingBubble() {
  const row = document.getElementById('thinking-row');
  if (row) row.remove();
}

async function openChat(chatId) {
  currentChatId = chatId;
  renderChatList();
  const chat = await api(`/api/chats/${chatId}`);
  messagesEl.innerHTML = '';
  messagesEl.appendChild(emptyStateEl);
  headerTitle.textContent = chat.title || 'New chat';
  if (!chat.messages || chat.messages.length === 0) {
    emptyStateEl.style.display = '';
  } else {
    emptyStateEl.style.display = 'none';
    for (const m of chat.messages) {
      addMessageBubble(m.role, m.content, m.sources, false);
    }
  }
}

async function newChat() {
  const chat = await api('/api/chats', { method: 'POST' });
  await refreshChatList();
  await openChat(chat.id);
  inputEl.focus();
}

async function deleteChat(chatId) {
  await api(`/api/chats/${chatId}`, { method: 'DELETE' });
  await refreshChatList();
  if (currentChatId === chatId) {
    currentChatId = null;
    messagesEl.innerHTML = '';
    messagesEl.appendChild(emptyStateEl);
    emptyStateEl.style.display = '';
    headerTitle.textContent = 'No chat selected';
  }
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || sending) return;

  if (!currentChatId) {
    const chat = await api('/api/chats', { method: 'POST' });
    await refreshChatList();
    currentChatId = chat.id;
    renderChatList();
  }

  inputEl.value = '';
  autoResize();
  sending = true;
  sendBtn.disabled = true;
  headerStatus.textContent = 'thinking…';

  addMessageBubble('user', text, null, false);
  addThinkingBubble();

  try {
    const resp = await fetch(`/api/chats/${currentChatId}/messages`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text }),
    });
    const data = await resp.json();
    removeThinkingBubble();
    addMessageBubble('assistant', data.content, data.sources, resp.status >= 400);
    headerTitle.textContent = (chats.find(c => c.id === currentChatId) || {}).title || headerTitle.textContent;
  } catch (err) {
    removeThinkingBubble();
    addMessageBubble('assistant', `Couldn't reach the server: ${err.message}`, null, true);
  } finally {
    sending = false;
    sendBtn.disabled = false;
    headerStatus.textContent = '';
    await refreshChatList();
    renderChatList();
    inputEl.focus();
  }
}

function autoResize() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
}

inputEl.addEventListener('input', autoResize);
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
sendBtn.addEventListener('click', sendMessage);
document.getElementById('new-chat-btn').addEventListener('click', newChat);

(async function init() {
  await refreshChatList();
  if (chats.length > 0) {
    await openChat(chats[0].id);
  }
})();
</script>
</body>
</html>
